# Water Trust Chatbot Configuration

# LLM Configuration
llm:
  provider: "mock"  # Options: "openai", "anthropic", "mock"
  model: "gpt-4"    # For OpenAI: "gpt-4", "gpt-3.5-turbo"; For Anthropic: "claude-3-sonnet-20240229"
  api_key: null     # Set via environment variable or here
  temperature: 0.7
  max_tokens: 2000
  primary_model: "gpt-4"

# Database Configuration
database:
  path: "data/water_facts.db"
  top_k: 5  # Number of facts to retrieve

# Web Search Configuration
web_search:
  enable: true
  max_results: 3
  trusted_domains:
    - "epa.gov"
    - "cdc.gov"
    - "who.int"
    - "awwa.org"
    - "water.usgs.gov"
    - "waterrf.org"
    - "nrdc.org"
    - "ewg.org"

# Strategy Maintenance Module (SMM) Configuration
smm:
  min_strategies: 1
  max_strategies: 5
  fact_check_threshold: 0.7  # Confidence threshold for strategy validation
  enable_web_enhancement: false  # Use web search to enhance strategies

# Question Handling Module (QHM) Configuration
qhm:
  enable_web_search: true

# Response Merger Configuration
merger:
  max_strategies_in_response: 3
  response_style: "balanced"  # Options: "factual", "persuasive", "balanced"

# Pipeline Configuration
pipeline:
  enable_caching: true
  cache_ttl: 3600  # Cache time-to-live in seconds (1 hour)

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "logs/chatbot.log"
